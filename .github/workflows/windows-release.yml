name: Windows Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw 'The tag must match the package version.'
          }
      - name: Build and test
        run: npm run update -- --package-only
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $product = node -p "require('./package.json').productName"
          $directory = "release/$tag"
          $assets = @("$directory/$product-$version-x64.exe", "$directory/$product-$version-portable.exe")
          foreach ($optional in @("$directory/$product-$version-x64.exe.blockmap", "$directory/latest.yml")) {
            if (Test-Path -LiteralPath $optional -PathType Leaf) { $assets += $optional }
          }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes
            exit $LASTEXITCODE
          }
          $release = $existing | ConvertFrom-Json
          if ($release.isDraft) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
            exit $LASTEXITCODE
          }
          $publishedNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($asset in $assets) {
            if ([IO.Path]::GetFileName($asset) -notin $publishedNames) {
              throw "The published release is missing $asset."
            }
          }
          Write-Output "$tag is already published with all expected assets."
